<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IG Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <label>[+] Instagram Profile</label>
      <input id="profile" placeholder="usuario" />

      <label>[+] What to Download</label>

      <div class="row">
        <div class="dropdown" id="modeDropdown">
          <div class="dropdown-selected">Everything</div>

          <div class="dropdown-options">
            <div data-value="all">Everything</div>
            <div data-value="photos">Photos</div>
            <div data-value="videos">Videos</div>
          </div>
        </div>

        <button id="go">DOWNLOAD</button>
      </div>

      <div id="log"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
